<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="HPSTREAM — Stream Unlimited Movies">
  <meta name="theme-color" content="#070709">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>HPSTREAM — Stream Unlimited Movies</title>
  <link rel="icon" href="./images/logo.png" type="image/x-icon">
  
  <!-- Preconnect Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="hpstream.css">
</head>
<body>

  <!-- Ambient Dynamic Lighting Layer -->
  <canvas id="ambient-canvas" class="ambient-canvas" aria-hidden="true"></canvas>
<div id="ambient-glow" class="ambient-glow-layer" aria-hidden="true"></div>

  <!-- Main Application Container -->
  <div id="app"></div>

  <!-- Mobile Drawer Menu -->
  <div id="mobile-nav" class="mobile-nav-drawer" aria-hidden="true">
    <div class="scrim" data-action="close-mobile-nav"></div>
    <div class="panel"></div>
  </div>

  <!-- Modal Roots -->
  <div id="modal-root"></div>
  <div id="trailer-modal-root"></div>
  <div id="toast-root"></div>

  <!-- Core JavaScript -->
  <script src="hpstream.js"></script>
</body>
</html>
