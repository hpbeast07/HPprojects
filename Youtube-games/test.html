<!DOCTYPE html>
<html>
<head>
    <title>ROLL RUSH: SKYLINE - Test</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #info { position: absolute; top: 10px; left: 10px; color: white; font-family: monospace; }
    </style>
</head>
<body>
    <div id="info">
        Game initialized<br>
        Three.js version: r128<br>
        Cannon-es version: 0.20.0
    </div>
    
    <canvas id="game-canvas"></canvas>
    
    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
        import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';
        
        // Simple test to verify libraries load
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('game-canvas')});
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);
        
        const geometry = new THREE.SphereGeometry(1, 32, 32);
        const material = new THREE.MeshStandardMaterial({color: 0xff0000});
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);
        
        const shape = new CANNON.Sphere(1);
        const body = new CANNON.Body({mass: 1, shape: shape});
        body.position.set(0, 5, 0);
        world.addBody(body);
        
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 7);
        scene.add(light);
        
        function animate() {
            requestAnimationFrame(animate);
            const dt = 1/60;
            world.step(dt);
            sphere.position.copy(body.position);
            sphere.quaternion.copy(body.quaternion);
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
